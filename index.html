<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPIT-405 | Lab 6</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            font-size: 36px;
            margin-bottom: 5px;
        }

        h2 {
            font-size: 24px;
            font-weight: normal;
            margin-bottom: 25px;
        }

        .vote-section {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .vote-btn {
            background-color: #e6e6e6;
            border: 1px solid #ccc;
            border-radius: 6px;
            padding: 10px 20px;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 120px;
            justify-content: center;
        }

        .vote-btn:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        h3 {
            font-size: 20px;
            margin-bottom: 15px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: inherit;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            margin-bottom: 15px;
        }

        .action-btns {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .action-btn {
            background-color: #4a4a4a;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 8px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        .action-btn:hover {
            background-color: #333333;
        }

        .comments-list {
            text-align: left;
            margin-top: 15px;
        }

        .comment-item {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 8px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Lab 6</h1>
    <h2>Like or dislike</h2>

    <div class="vote-section">
        <button id="likeBtn" class="vote-btn">👍 <span id="likeCount">100</span></button>
        <button id="dislikeBtn" class="vote-btn">👎 <span id="dislikeCount">20</span></button>
    </div>

    <h3>Comments</h3>
    <textarea id="commentInput" placeholder="Write a comment..."></textarea>

    <div class="action-btns">
        <button id="submitBtn" class="action-btn">Submit</button>
        <button id="clearBtn" class="action-btn">Clear</button>
    </div>

    <div id="commentsContainer" class="comments-list"></div>
</div>

<script>
    const DEFAULT_LIKES = 100;
    const DEFAULT_DISLIKES = 20;

    const likeBtn = document.getElementById("likeBtn");
    const dislikeBtn = document.getElementById("dislikeBtn");
    const likeCountSpan = document.getElementById("likeCount");
    const dislikeCountSpan = document.getElementById("dislikeCount");
    const commentInput = document.getElementById("commentInput");
    const submitBtn = document.getElementById("submitBtn");
    const clearBtn = document.getElementById("clearBtn");
    const commentsContainer = document.getElementById("commentsContainer");

    function setCookie(name, value, days = 7) {
        const date = new Date();
        date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
        document.cookie = name + "=" + encodeURIComponent(value) + "; expires=" + date.toUTCString() + "; path=/";
    }

    function getCookie(name) {
        const nameEQ = name + "=";
        const ca = document.cookie.split(';');
        for (let i = 0; i < ca.length; i++) {
            let c = ca[i].trim();
            if (c.indexOf(nameEQ) === 0) {
                return decodeURIComponent(c.substring(nameEQ.length, c.length));
            }
        }
        return null;
    }

    function deleteCookie(name) {
        document.cookie = name + "=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
    }

    function loadState() {
        const savedLikes = getCookie("likesCount");
        const savedDislikes = getCookie("dislikesCount");
        const userVote = getCookie("userVote");
        const savedComment = getCookie("userComment");

        likeCountSpan.textContent = savedLikes ? savedLikes : DEFAULT_LIKES;
        dislikeCountSpan.textContent = savedDislikes ? savedDislikes : DEFAULT_DISLIKES;

        if (userVote) {
            likeBtn.disabled = true;
            dislikeBtn.disabled = true;
        }

        if (savedComment) {
            renderComment(savedComment);
            commentInput.disabled = true;
            submitBtn.disabled = true;
        }
    }

    function renderComment(text) {
        commentsContainer.innerHTML = "";
        const div = document.createElement("div");
        div.className = "comment-item";
        div.textContent = text;
        commentsContainer.appendChild(div);
    }

    likeBtn.addEventListener("click", () => {
        if (getCookie("userVote")) return;

        let currentLikes = parseInt(likeCountSpan.textContent);
        currentLikes++;
        likeCountSpan.textContent = currentLikes;

        setCookie("likesCount", currentLikes);
        setCookie("userVote", "like");

        likeBtn.disabled = true;
        dislikeBtn.disabled = true;
    });

    dislikeBtn.addEventListener("click", () => {
        if (getCookie("userVote")) return;

        let currentDislikes = parseInt(dislikeCountSpan.textContent);
        currentDislikes++;
        dislikeCountSpan.textContent = currentDislikes;

        setCookie("dislikesCount", currentDislikes);
        setCookie("userVote", "dislike");

        likeBtn.disabled = true;
        dislikeBtn.disabled = true;
    });

    submitBtn.addEventListener("click", () => {
        const text = commentInput.value.trim();
        if (!text) return;
        if (getCookie("userComment")) return;

        setCookie("userComment", text);
        renderComment(text);

        commentInput.value = "";
        commentInput.disabled = true;
        submitBtn.disabled = true;
    });

    clearBtn.addEventListener("click", () => {
        deleteCookie("userVote");
        deleteCookie("likesCount");
        deleteCookie("dislikesCount");
        deleteCookie("userComment");

        likeCountSpan.textContent = DEFAULT_LIKES;
        dislikeCountSpan.textContent = DEFAULT_DISLIKES;
        likeBtn.disabled = false;
        dislikeBtn.disabled = false;

        commentInput.value = "";
        commentInput.disabled = false;
        submitBtn.disabled = false;
        commentsContainer.innerHTML = "";
    });

    loadState();
</script>

</body>
</html>
